# /etc/nginx/sites-available/locatron
#
# The only port forwarded out of this container. Requests arrive from the
# external nginx, which is behind Cloudflare. Because the forwarded port is
# also reachable directly, the shared-secret header is what actually gates
# access -- Cloudflare is not in the path for a direct hit.

server {
    listen 8000 default_server;
    server_name _;

    # Generate with: openssl rand -hex 32
    # Must match X-Locatron-Edge set by the external nginx.
    if ($http_x_locatron_edge != "REPLACE_ME") {
        return 444;
    }

    client_max_body_size 16m;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    access_log /var/log/nginx/locatron.access.log;
    error_log  /var/log/nginx/locatron.error.log;

    # Longest prefix wins, so the parts and export locations take precedence
    # over the catch-all below.

    # Pre-built Parquet snapshots, served straight off disk. Never let a
    # multi-GB download stream through Python.
    location /locatron/v1/export/parts/ {
        alias /var/lib/locatron/exports/;
        autoindex off;
        add_header Cache-Control "public, max-age=86400, immutable";
    }

    # Bulk API. Long timeouts, buffering off so streamed NDJSON flows.
    location /locatron/v1/export/ {
        proxy_pass http://127.0.0.1:8081/v1/export/;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /locatron/healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        access_log off;
    }

    # Interactive API. The trailing slash on proxy_pass strips the /locatron/
    # prefix, so FastAPI sees /v1/resolve. root_path in the app exists only so
    # the OpenAPI docs generate working URLs.
    location /locatron/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_read_timeout 30s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        return 404;
    }
}
